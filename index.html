<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yoodle — Odd Jobs</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
:root{
  --purple:#9B59D4;
  --lime:#A3E635;
  --pink:#EC4899;
  --teal:#06B6D4;
  --bg:#0A0A0A;
  --surface:#161616;
  --border:#2A2A2A;
  --text:#F5F5F5;
  --muted:#777;
  --radius:18px;
}

/* GLOBAL */
body{
  margin:0;
  font-family:system-ui;
  background:var(--bg);
  color:var(--text);
  overflow:hidden;
}

/* =========================
   CATEGORY BASE (MOBILE FIRST)
========================= */

.cat-scroll,
.map-cats{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:10px 16px;
  scrollbar-width:none;
  flex-shrink:0;
}

.cat-scroll::-webkit-scrollbar,
.map-cats::-webkit-scrollbar{
  display:none;
}

.cat-chip,
.map-cat{
  flex:0 0 auto;
  padding:8px 14px;
  border-radius:999px;
  background:var(--surface);
  border:1px solid var(--border);
  white-space:nowrap;
  font-weight:700;
  cursor:pointer;
}

.cat-chip.active,
.map-cat.active{
  background:var(--purple);
  color:white;
}

/* POST GRID (mobile default) */
.cat-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.cat-opt{
  padding:12px;
  border-radius:12px;
  background:var(--surface);
  border:1px solid var(--border);
  text-align:center;
}

.cat-opt.sel{
  border-color:var(--purple);
  color:var(--purple);
}

/* =========================
   DESKTOP: CONVERT TO GRID
========================= */
@media (min-width:768px){

  .cat-scroll,
  .map-cats{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(140px,1fr));
    overflow-x:visible;
    gap:10px;
  }

  .cat-chip,
  .map-cat{
    width:100%;
    justify-content:center;
  }

  .cat-grid{
    grid-template-columns:repeat(auto-fit, minmax(120px,1fr));
  }
}

/* =========================
   LAYOUT (simplified)
========================= */

.view{
  display:none;
  height:100vh;
}

.view.active{
  display:flex;
  flex-direction:column;
}

.header{
  padding:16px;
  font-weight:900;
}

.scroll{
  flex:1;
  overflow:auto;
}

/* JOB LIST */
.jobs{
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.job{
  padding:14px;
  border-radius:var(--radius);
  background:var(--surface);
  border:1px solid var(--border);
}
</style>
</head>

<body>

<!-- ================= LIST VIEW ================= -->
<div id="list-view" class="view active">

  <div class="header">Jobs Near You</div>

  <div class="cat-scroll">
    <button class="cat-chip active" onclick="setActiveCategory('all')">🔥 All</button>
    <button class="cat-chip" onclick="setActiveCategory('assembly')">🔧 Assembly</button>
    <button class="cat-chip" onclick="setActiveCategory('yard')">🌿 Yard</button>
    <button class="cat-chip" onclick="setActiveCategory('moving')">📦 Moving</button>
    <button class="cat-chip" onclick="setActiveCategory('errands')">🏃 Errands</button>
    <button class="cat-chip" onclick="setActiveCategory('other')">✨ Other</button>
  </div>

  <div class="scroll">
    <div class="jobs" id="jobs"></div>
  </div>
</div>

<!-- ================= POST VIEW ================= -->
<div id="post-view" class="view">

  <div class="header">Post Job</div>

  <div class="cat-grid">
    <div class="cat-opt" data-cat="assembly" onclick="selCat(this)">🔧 Assembly</div>
    <div class="cat-opt" data-cat="yard" onclick="selCat(this)">🌿 Yard</div>
    <div class="cat-opt" data-cat="moving" onclick="selCat(this)">📦 Moving</div>
    <div class="cat-opt" data-cat="errands" onclick="selCat(this)">🏃 Errands</div>
    <div class="cat-opt" data-cat="other" onclick="selCat(this)">✨ Other</div>
  </div>
</div>

<script>
/* =========================
   STATE (NEW UNIFIED MODEL)
========================= */

let activeCategory = 'all';
let listCatFilter = 'all';
let mapCatFilter = 'all';

let allJobs = [];

/* =========================
   MASTER CATEGORY HANDLER
========================= */

function setActiveCategory(cat){
  activeCategory = cat;

  listCatFilter = cat;
  mapCatFilter = cat;

  renderJobs();      // list refresh
  syncCategoryUI();  // UI sync
}

/* =========================
   SYNC UI ACROSS VIEWS
========================= */

function syncCategoryUI(){

  document.querySelectorAll('.cat-chip').forEach(el=>{
    const match = el.getAttribute('onclick')?.includes(`'${activeCategory}'`);
    el.classList.toggle('active', match);
  });

  document.querySelectorAll('.cat-opt').forEach(el=>{
    el.classList.toggle('sel', el.dataset.cat === activeCategory);
  });
}

/* =========================
   POST CATEGORY SELECT
========================= */

function selCat(el){
  setActiveCategory(el.dataset.cat);
}

/* =========================
   RENDER JOBS (SIMPLE MOCK)
========================= */

function renderJobs(){

  const filtered =
    activeCategory === 'all'
      ? allJobs
      : allJobs.filter(j => j.category === activeCategory);

  const container = document.getElementById('jobs');

  container.innerHTML = filtered.map(j => `
    <div class="job">
      <div style="font-weight:800">${j.title}</div>
      <div style="opacity:.7">${j.category}</div>
    </div>
  `).join('');
}

/* =========================
   INIT MOCK DATA
========================= */

allJobs = [
  { title:"Move couch", category:"moving" },
  { title:"Fix shelf", category:"assembly" },
  { title:"Garden cleanup", category:"yard" },
  { title:"Grocery run", category:"errands" }
];

renderJobs();
syncCategoryUI();

</script>

</body>
</html>
