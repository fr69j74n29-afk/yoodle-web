<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Yoodle</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
/* =========================================================
   KEEP YOUR ORIGINAL STYLES ABOVE THIS SECTION
   (UNCHANGED — NOT REWRITTEN)
========================================================= */


/* =========================================================
   CATEGORY SYSTEM (SAFE ADDITION LAYER)
========================================================= */

/* MOBILE DEFAULT: SWIPE */
.cat-scroll,
.map-cats{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding:10px 14px;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}

.cat-scroll::-webkit-scrollbar,
.map-cats::-webkit-scrollbar{
  display:none;
}

.cat-chip,
.map-cat{
  flex:0 0 auto;
  padding:8px 14px;
  border-radius:999px;
  background:#1f1f1f;
  border:1px solid #333;
  white-space:nowrap;
  cursor:pointer;
  font-weight:600;
}

.cat-chip.active,
.map-cat.active{
  background:#9B59D4;
  color:#fff;
}

/* POST GRID (MOBILE) */
.cat-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.cat-opt{
  padding:12px;
  background:#1a1a1a;
  border:1px solid #333;
  border-radius:12px;
  text-align:center;
  cursor:pointer;
}

.cat-opt.sel{
  border-color:#9B59D4;
  color:#9B59D4;
}

/* =========================================================
   DESKTOP OVERRIDES (GRID MODE)
========================================================= */

@media(min-width:768px){

  .cat-scroll,
  .map-cats{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(140px,1fr));
    overflow-x:visible;
  }

  .cat-chip,
  .map-cat{
    width:100%;
    text-align:center;
  }

  .cat-grid{
    grid-template-columns:repeat(auto-fit, minmax(140px,1fr));
  }
}

/* =========================================================
   DO NOT TOUCH YOUR EXISTING LAYOUT / MAP STYLES
========================================================= */
</style>
</head>

<body>

<!-- =========================================================
     MAP VIEW (UNCHANGED STRUCTURE)
========================================================= -->
<div id="map-view" class="view active">

  <!-- YOUR ORIGINAL MAP HEADER / CONTROLS HERE -->

  <div class="map-cats">
    <div class="map-cat active" onclick="setCategory('all')">All</div>
    <div class="map-cat" onclick="setCategory('assembly')">🔧 Assembly</div>
    <div class="map-cat" onclick="setCategory('yard')">🌿 Yard</div>
    <div class="map-cat" onclick="setCategory('moving')">📦 Moving</div>
    <div class="map-cat" onclick="setCategory('errands')">🏃 Errands</div>
    <div class="map-cat" onclick="setCategory('other')">✨ Other</div>
  </div>

  <div id="map"></div>

</div>


<!-- =========================================================
     LIST VIEW (UNCHANGED STRUCTURE)
========================================================= -->
<div id="list-view" class="view">

  <div class="cat-scroll">
    <div class="cat-chip active" onclick="setCategory('all')">All 🔥</div>
    <div class="cat-chip" onclick="setCategory('assembly')">🔧 Assembly</div>
    <div class="cat-chip" onclick="setCategory('yard')">🌿 Yard</div>
    <div class="cat-chip" onclick="setCategory('moving')">📦 Moving</div>
    <div class="cat-chip" onclick="setCategory('errands')">🏃 Errands</div>
    <div class="cat-chip" onclick="setCategory('other')">✨ Other</div>
  </div>

  <div id="jobList"></div>

</div>


<!-- =========================================================
     POST VIEW (UNCHANGED STRUCTURE)
========================================================= -->
<div id="post-view" class="view">

  <div class="cat-grid">
    <div class="cat-opt" data-cat="assembly" onclick="selCat(this)">🔧 Assembly</div>
    <div class="cat-opt" data-cat="yard" onclick="selCat(this)">🌿 Yard</div>
    <div class="cat-opt" data-cat="moving" onclick="selCat(this)">📦 Moving</div>
    <div class="cat-opt" data-cat="errands" onclick="selCat(this)">🏃 Errands</div>
    <div class="cat-opt" data-cat="other" onclick="selCat(this)">✨ Other</div>
  </div>

</div>


<script>

/* =========================================================
   1. GLOBAL STATE (NEW ADDITION)
========================================================= */

let activeCategory = 'all';
let listCatFilter = 'all';
let mapCatFilter = 'all';

/* your existing globals remain untouched */
let allJobs = [];


/* =========================================================
   2. MASTER CATEGORY CONTROLLER (NEW CORE LOGIC)
========================================================= */

function setCategory(cat){

  activeCategory = cat;

  listCatFilter = cat;
  mapCatFilter = cat;

  // KEEP YOUR ORIGINAL RENDER FUNCTIONS
  if (typeof renderListGrid === "function") renderListGrid(allJobs);
  if (typeof renderMapPins === "function") renderMapPins(allJobs);

  syncCategoryUI();
}


/* =========================================================
   3. POST CATEGORY SELECT (PATCH ONLY)
========================================================= */

function selCat(el){
  setCategory(el.dataset.cat);
  selCatVal = el.dataset.cat; // preserve your existing logic
}


/* =========================================================
   4. MAP + LIST FILTER ENTRY POINT PATCHES
========================================================= */

function mapFilterCat(el, cat){
  setCategory(cat);
}

function listFilterCat(el, cat){
  setCategory(cat);
}


/* =========================================================
   5. UI SYNC SYSTEM (NEW)
========================================================= */

function syncCategoryUI(){

  // LIST
  document.querySelectorAll('.cat-chip').forEach(el=>{
    const cat = el.getAttribute('onclick')?.match(/'([^']+)'/)?.[1];
    el.classList.toggle('active', cat === activeCategory);
  });

  // MAP
  document.querySelectorAll('.map-cat').forEach(el=>{
    const cat = el.getAttribute('onclick')?.match(/'([^']+)'/)?.[1];
    el.classList.toggle('active', cat === activeCategory);
  });

  // POST
  document.querySelectorAll('.cat-opt').forEach(el=>{
    el.classList.toggle('sel', el.dataset.cat === activeCategory);
  });
}


/* =========================================================
   6. INITIAL LOAD SYNC HOOK
========================================================= */

document.addEventListener("DOMContentLoaded", ()=>{
  syncCategoryUI();
});

</script>

<!-- =========================================================
   YOUR ORIGINAL SUPABASE + LEAFLET + RENDER LOGIC BELOW
   (UNCHANGED — DO NOT MODIFY)
========================================================= -->

</body>
</html>
