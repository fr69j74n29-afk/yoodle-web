# Live update for the iOS app through Capgo: uploads the app's web files (index.html, js/, pages, images) so installed
# apps pick them up without a new TestFlight / App Store build. Native changes (plugins, Info.plist, icons) still need one.
#
# Run by hand only: push a tag named capgo-<anything> on a commit of the release branch (mobile-app for now, main later):
#   git tag capgo-1 origin/mobile-app && git push origin capgo-1
# Phones download it in the background and switch to it the next time the app comes back from the background
# (capacitor.config.json: CapacitorUpdater.autoUpdate = "atBackground").
#
# Bundle version: <app version major.minor>.<run number>, e.g. 1.0.3. It's always above the native app version (1.0),
# so Capgo's "no bundles below the native version" rule lets it through, and it goes up with every run.
# A re-run of the same run reuses the number and fails ("version exists"): start a new run (new tag) instead.
#
# Setup: repository secret CAPGO_TOKEN (Capgo API key with upload rights for ca.yoodle.app).
# The repo is public, so logs are public: never print secrets.
name: Capgo live update

on:
  push:
    tags: ['capgo-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capgo-update
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check setup
        working-directory: .
        env:
          CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}
        run: |
          if [ -z "$CAPGO_TOKEN" ]; then
            echo "Missing repository secret CAPGO_TOKEN." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Only commits that are on the release branch go to phones
      - name: Check the commit is on the release branch
        working-directory: .
        env:
          RELEASE_BRANCH: mobile-app
        run: |
          git fetch -q origin "$RELEASE_BRANCH"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$RELEASE_BRANCH"; then
            echo "Commit ${GITHUB_SHA:0:7} is not on $RELEASE_BRANCH; not uploading." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install
        run: npm ci

      - name: Build the web bundle (mobile/www)
        run: npm run build:www

      - name: Bundle version
        run: |
          mv=$(grep -m1 -o 'MARKETING_VERSION = [0-9.]*' ios/App/App.xcodeproj/project.pbxproj | grep -o '[0-9.]*$')
          base=$(echo "$mv" | awk -F. '{print $1"."($2==""?0:$2)}')
          echo "BUNDLE=$base.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "App version $mv -> bundle $base.$GITHUB_RUN_NUMBER"

      # --accept-incompatible: older app builds may lack a native plugin this bundle can use; the app's code checks for
      #   each plugin before using it (e.g. Preferences, SocialLogin, OneSignal), so that's handled.
      # --no-key: bundles aren't encrypted (no signing key set up yet).
      - name: Upload to Capgo (production channel)
        env:
          CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}
        run: |
          npx --yes @capgo/cli@8.112.0 bundle upload ca.yoodle.app \
            --apikey "$CAPGO_TOKEN" \
            --path www \
            --channel production \
            --bundle "$BUNDLE" \
            --comment "$GITHUB_REF_NAME @ ${GITHUB_SHA:0:7}" \
            --accept-incompatible \
            --no-key

      - name: Summary
        working-directory: .
        run: |
          {
            echo "### Live update uploaded to Capgo"
            echo "Bundle **$BUNDLE** from \`$GITHUB_REF_NAME\` @ \`${GITHUB_SHA:0:7}\` on the **production** channel."
            echo "Phones get it in the background and switch to it the next time the app comes back from the background."
          } | tee -a "$GITHUB_STEP_SUMMARY"
