# Builds the Yoodle iOS app on a GitHub-hosted Mac (no local Mac needed; free because the repo is public).
# Stage A (now): an UNSIGNED iOS Simulator build, so no Apple Developer account is needed.
#   Output: artifact "Yoodle-ios-simulator" -> Yoodle-sim.zip (contains App.app). Upload that zip to Appetize.io to run it in a browser.
# Stage B (later, after the paid Apple account): add a signed job that uploads to TestFlight.
# Details: docs/capacitor-build.md section 2.2. Repo is public, so logs are public: never print secrets.
name: iOS build

on:
  push:
    branches: [mobile-app, main, staging]
    paths:
      - 'mobile/**'
      - 'index.html'
      - 'js/**'
      - '*.html'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Tool versions
        run: |
          xcodebuild -version
          node -v

      - name: Install Capacitor
        run: npm ci

      - name: Build web bundle and sync into the iOS project
        run: |
          npm run build:www
          npx cap sync ios

      - name: Build for iOS Simulator (unsigned)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Zip App.app
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          ditto -c -k --sequesterRsrc --keepParent App.app "$GITHUB_WORKSPACE/Yoodle-sim.zip"
          ls -lh "$GITHUB_WORKSPACE/Yoodle-sim.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Yoodle-ios-simulator
          path: Yoodle-sim.zip
          retention-days: 14

      # Upload straight to Appetize (docs/capacitor-build.md section 2.2).
      #   Secret   YOODLE_MOBILE_APPETIZE_TOKEN: Appetize -> Organization Settings -> API Token. Skipped if not set.
      #   Variable APPETIZE_APP_KEY: the Appetize app's public key. Set it to update that same app (same link every time);
      #   if it's empty, a new Appetize app is created and its key is printed in the run summary to save as the variable.
      - name: Upload to Appetize
        if: ${{ github.event_name != 'pull_request' }}
        working-directory: .
        env:
          APPETIZE_API_TOKEN: ${{ secrets.YOODLE_MOBILE_APPETIZE_TOKEN }}
          APPETIZE_APP_KEY: ${{ vars.APPETIZE_APP_KEY }}
          NOTE: ${{ github.ref_name }} @ ${{ github.sha }}
        run: |
          if [ -z "$APPETIZE_API_TOKEN" ]; then
            echo "YOODLE_MOBILE_APPETIZE_TOKEN secret not set; skipping Appetize upload." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          url="https://api.appetize.io/v1/apps${APPETIZE_APP_KEY:+/$APPETIZE_APP_KEY}"
          curl -sS --fail-with-body -o appetize.json -X POST "$url" \
            -H "X-API-KEY: $APPETIZE_API_TOKEN" \
            -F "file=@Yoodle-sim.zip" \
            --form-string "platform=ios" \
            --form-string "note=${NOTE:0:200}"
          key=$(jq -r '.publicKey' appetize.json)
          {
            echo "### iOS build on Appetize"
            echo "Open: https://appetize.io/app/$key"
            if [ -z "$APPETIZE_APP_KEY" ]; then
              echo ""
              echo "New Appetize app created. Save \`$key\` as the repository variable **APPETIZE_APP_KEY** so future builds update this same app."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
