<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yoodle – Job Cleanup</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --purple: #9B59D4;
    --lime: #A3E635;
    --bg: #0A0A0A;
    --surface: #161616;
    --surface2: #1F1F1F;
    --border: #2A2A2A;
    --text: #F5F5F5;
    --muted: #999;
    --red: #EF4444;
    --orange: #F97316;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg); color: var(--text);
    padding: 40px; max-width: 900px; margin: 0 auto;
  }
  h1 { font-size: 24px; margin-bottom: 4px; }
  .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 24px; }

  #auth-view {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; min-height: 60vh; gap: 16px;
  }
  #auth-view h2 { font-size: 20px; margin-bottom: 4px; }
  #auth-view p { color: var(--muted); font-size: 13px; max-width: 360px; text-align: center; }
  #auth-view input[type="email"] {
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text); padding: 12px 16px; border-radius: 10px;
    font-size: 14px; width: 320px; text-align: center;
  }
  #auth-view input:focus { outline: none; border-color: var(--purple); }
  .btn-magic {
    background: var(--purple); color: #fff; border: none; border-radius: 10px;
    padding: 12px 32px; font-size: 14px; font-weight: 700;
    cursor: pointer; font-family: inherit;
  }
  .btn-magic:disabled { opacity: .5; cursor: not-allowed; }
  #magic-sent {
    display: none; background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px; text-align: center; max-width: 360px;
  }
  #magic-sent p { color: var(--lime); font-weight: 600; }

  #app-view { display: none; }
  .user-bar {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 20px; padding: 12px 16px;
    background: var(--surface); border-radius: 12px; border: 1px solid var(--border);
  }
  .user-bar .email { font-size: 13px; color: var(--text); font-weight: 600; }
  .user-bar .uid { font-size: 11px; color: var(--muted); font-family: monospace; }
  .btn-signout {
    margin-left: auto; background: var(--surface2); color: var(--muted);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 14px; font-size: 12px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  .toolbar {
    display: flex; gap: 12px; align-items: center;
    margin-bottom: 16px; flex-wrap: wrap;
  }
  .toolbar label { font-size: 13px; color: var(--muted); cursor: pointer; }
  .count { font-size: 13px; color: var(--muted); margin-left: auto; }
  button {
    font-family: inherit; cursor: pointer; border: none; border-radius: 8px;
    padding: 8px 16px; font-size: 13px; font-weight: 600;
  }
  .btn-cancel { background: var(--orange); color: #fff; }
  .btn-cancel:disabled { opacity: .4; cursor: not-allowed; }
  .btn-delete { background: var(--red); color: #fff; }
  .btn-delete:disabled { opacity: .4; cursor: not-allowed; }
  .btn-refresh { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-select { background: var(--surface2); color: var(--muted); border: 1px solid var(--border); font-size: 12px; }
  table {
    width: 100%; border-collapse: collapse;
    background: var(--surface); border-radius: 12px; overflow: hidden;
  }
  th {
    text-align: left; padding: 12px 14px; font-size: 12px;
    color: var(--muted); text-transform: uppercase; letter-spacing: .5px;
    background: var(--surface2); border-bottom: 1px solid var(--border);
  }
  td {
    padding: 12px 14px; border-bottom: 1px solid var(--border);
    font-size: 13px; vertical-align: top;
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--surface2); }
  .title-cell { font-weight: 600; }
  .desc-cell { color: var(--muted); max-width: 400px; }
  .status-pill {
    display: inline-block; padding: 2px 8px; border-radius: 100px;
    font-size: 11px; font-weight: 700; text-transform: uppercase;
  }
  .status-open { background: rgba(163,230,53,.15); color: var(--lime); }
  .status-claimed { background: rgba(155,89,212,.15); color: var(--purple); }
  .status-completed { background: rgba(6,182,212,.15); color: #06B6D4; }
  .status-cancelled { background: rgba(239,68,68,.15); color: var(--red); }
  .status-expired { background: rgba(153,153,153,.15); color: var(--muted); }
  .date-cell { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .price-cell { font-weight: 600; color: var(--lime); font-size: 12px; }
  input[type="checkbox"] {
    width: 16px; height: 16px; accent-color: var(--purple); cursor: pointer;
  }
  .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
  .spinner { text-align: center; padding: 60px; color: var(--muted); }
  .toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    background: var(--surface2); color: var(--text); padding: 10px 20px;
    border-radius: 10px; font-size: 13px; font-weight: 600;
    border: 1px solid var(--border); z-index: 999;
    opacity: 0; transition: opacity .3s;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div id="auth-view">
  <h2>🧹 Yoodle Job Cleanup</h2>
  <p>Sign in with your email to manage and bulk-cancel or delete your jobs.</p>
  <input type="email" id="magic-email" placeholder="your@email.com" autocomplete="email">
  <button class="btn-magic" id="magic-btn" onclick="sendMagicLink()">Send Magic Link ✉️</button>
  <div id="magic-sent">
    <p>✅ Check your inbox!</p>
    <p style="color:var(--muted);font-weight:400;margin-top:6px">Click the link sent to <strong id="magic-addr"></strong><br>It will open this page logged in.</p>
  </div>
</div>

<div id="app-view">
  <h1>🧹 Yoodle Job Cleanup</h1>
  <p class="subtitle">Bulk cancel or delete jobs posted by your account</p>

  <div class="user-bar">
    <div>
      <div class="email" id="user-email"></div>
      <div class="uid" id="user-pid"></div>
    </div>
    <button class="btn-signout" onclick="signOut()">Sign Out</button>
  </div>

  <div class="toolbar">
    <button class="btn-refresh" onclick="loadJobs()">↻ Refresh</button>
    <button class="btn-select" onclick="selectAll()">Select All</button>
    <button class="btn-select" onclick="selectNone()">Deselect All</button>
    <label><input type="checkbox" id="filter-open" checked onchange="loadJobs()"> open</label>
    <label><input type="checkbox" id="filter-claimed" checked onchange="loadJobs()"> claimed</label>
    <label><input type="checkbox" id="filter-completed" onchange="loadJobs()"> completed</label>
    <label><input type="checkbox" id="filter-cancelled" onchange="loadJobs()"> cancelled</label>
    <label><input type="checkbox" id="filter-expired" onchange="loadJobs()"> expired</label>
    <span class="count" id="count-label">—</span>
  </div>

  <div class="toolbar">
    <button class="btn-cancel" id="cancel-btn" disabled onclick="bulkCancel()">⛔ Cancel Selected (<span id="cancel-count">0</span>)</button>
    <button class="btn-delete" id="del-btn" disabled onclick="bulkDelete()">🗑 Delete Selected (<span id="del-count">0</span>)</button>
  </div>

  <div id="table-wrap">
    <div class="spinner">Loading…</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var SUPABASE_URL  = 'https://pyzugtltkbpcxvokdmps.supabase.co';
var SUPABASE_ANON = 'sb_publishable_9qnjqRwusYBArg79bBv81w_kauJZPBZ';

var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

var me = null;
var myProfileId = null;
var jobs = [];
var selected = new Set();

function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 3000);
}

// ── Auth ──
async function sendMagicLink() {
  var email = document.getElementById('magic-email').value.trim();
  if (!email || !email.includes('@')) return toast('Enter a valid email');
  var btn = document.getElementById('magic-btn');
  btn.disabled = true; btn.textContent = 'Sending…';
  var res = await sb.auth.signInWithOtp({
    email: email,
    options: { emailRedirectTo: window.location.href.split('#')[0].split('?')[0] }
  });
  btn.textContent = 'Send Magic Link ✉️';
  if (res.error) { btn.disabled = false; return toast('❌ ' + res.error.message); }
  document.getElementById('magic-addr').textContent = email;
  document.getElementById('magic-sent').style.display = 'block';
}

async function signOut() {
  await sb.auth.signOut();
  me = null; myProfileId = null;
  document.getElementById('auth-view').style.display = 'flex';
  document.getElementById('app-view').style.display = 'none';
}

async function onAuth(user) {
  me = user;
  var res = await sb.from('profiles').select('id, name').eq('id', me.id).maybeSingle();
  myProfileId = (res.data && res.data.id) || me.id;

  document.getElementById('user-email').textContent = me.email || '';
  document.getElementById('user-pid').textContent = 'profile: ' + myProfileId;
  document.getElementById('auth-view').style.display = 'none';
  document.getElementById('app-view').style.display = 'block';
  loadJobs();
}

// ── Jobs ──
function getActiveStatuses() {
  var s = [];
  if (document.getElementById('filter-open').checked)      s.push('open');
  if (document.getElementById('filter-claimed').checked)    s.push('claimed');
  if (document.getElementById('filter-completed').checked)  s.push('completed');
  if (document.getElementById('filter-cancelled').checked)  s.push('cancelled');
  if (document.getElementById('filter-expired').checked)    s.push('expired');
  return s;
}

async function loadJobs() {
  var wrap = document.getElementById('table-wrap');
  wrap.innerHTML = '<div class="spinner">Loading…</div>';
  selected.clear(); updateSelCount();

  var statuses = getActiveStatuses();
  if (!statuses.length) {
    wrap.innerHTML = '<div class="empty">No status filters selected</div>';
    document.getElementById('count-label').textContent = '—';
    return;
  }

  var res = await sb
    .from('tasks')
    .select('id, title, description, status, price, created_at')
    .eq('poster_id', myProfileId)
    .in('status', statuses)
    .order('created_at', { ascending: false });

  if (res.error) {
    wrap.innerHTML = '<div class="empty" style="color:var(--red)">Error: ' + esc(res.error.message) + '</div>';
    return;
  }

  jobs = res.data || [];
  document.getElementById('count-label').textContent = jobs.length + ' job' + (jobs.length !== 1 ? 's' : '');

  if (!jobs.length) {
    wrap.innerHTML = '<div class="empty">No jobs found with selected filters.</div>';
    return;
  }

  var rows = '';
  for (var i = 0; i < jobs.length; i++) {
    var j = jobs[i];
    var desc = (j.description || '').slice(0, 120);
    var ellipsis = (j.description || '').length > 120 ? '…' : '';
    var price = j.price ? '$' + Number(j.price).toFixed(0) : '—';
    var date = new Date(j.created_at).toLocaleDateString('en-CA');
    rows += '<tr>'
      + '<td><input type="checkbox" data-id="' + j.id + '" onchange="toggleRow(this)"></td>'
      + '<td class="title-cell">' + esc(j.title || '—') + '</td>'
      + '<td class="desc-cell">' + esc(desc) + ellipsis + '</td>'
      + '<td><span class="status-pill status-' + j.status + '">' + j.status + '</span></td>'
      + '<td class="price-cell">' + price + '</td>'
      + '<td class="date-cell">' + date + '</td>'
      + '</tr>';
  }

  wrap.innerHTML = '<table>'
    + '<thead><tr>'
    + '<th style="width:36px"><input type="checkbox" id="chk-all" onchange="toggleAll(this)"></th>'
    + '<th>Title</th><th>Description</th><th>Status</th><th>Price</th><th>Created</th>'
    + '</tr></thead>'
    + '<tbody>' + rows + '</tbody></table>';
}

function esc(s) {
  var d = document.createElement('div'); d.textContent = s; return d.innerHTML;
}

// ── Selection ──
function toggleRow(cb) {
  if (cb.checked) selected.add(cb.dataset.id);
  else selected.delete(cb.dataset.id);
  updateSelCount();
}

function toggleAll(cb) {
  document.querySelectorAll('tbody input[type="checkbox"]').forEach(function(c) {
    c.checked = cb.checked;
    if (cb.checked) selected.add(c.dataset.id);
    else selected.delete(c.dataset.id);
  });
  updateSelCount();
}

function selectAll() {
  var hdr = document.getElementById('chk-all');
  if (hdr) hdr.checked = true;
  document.querySelectorAll('tbody input[type="checkbox"]').forEach(function(c) {
    c.checked = true; selected.add(c.dataset.id);
  });
  updateSelCount();
}

function selectNone() {
  var hdr = document.getElementById('chk-all');
  if (hdr) hdr.checked = false;
  document.querySelectorAll('tbody input[type="checkbox"]').forEach(function(c) { c.checked = false; });
  selected.clear(); updateSelCount();
}

function updateSelCount() {
  var n = selected.size;
  document.getElementById('cancel-count').textContent = n;
  document.getElementById('del-count').textContent = n;
  document.getElementById('cancel-btn').disabled = n === 0;
  document.getElementById('del-btn').disabled = n === 0;
}

// ── Bulk Cancel (fast — single UPDATE) ──
async function bulkCancel() {
  var ids = Array.from(selected);
  if (!ids.length) return;

  // Check if any are already cancelled
  var alreadyCancelled = jobs.filter(function(j) { return ids.includes(j.id) && j.status === 'cancelled'; });
  if (alreadyCancelled.length === ids.length) return toast('All selected are already cancelled');

  if (!confirm('Cancel ' + ids.length + ' job' + (ids.length > 1 ? 's' : '') + '?\n\nSets status to "cancelled". Data is preserved.')) return;

  var btn = document.getElementById('cancel-btn');
  btn.disabled = true; btn.textContent = '⛔ Cancelling…';

  var res = await sb.from('tasks').update({ status: 'cancelled' }).in('id', ids);

  if (res.error) {
    toast('❌ Cancel failed: ' + res.error.message);
    btn.disabled = false;
    btn.innerHTML = '⛔ Cancel Selected (<span id="cancel-count">' + selected.size + '</span>)';
    return;
  }

  toast('✅ Cancelled ' + ids.length + ' job' + (ids.length > 1 ? 's' : ''));
  loadJobs();
}

// ── Bulk Delete (slower — cleans related tables) ──
async function bulkDelete() {
  var ids = Array.from(selected);
  if (!ids.length) return;
  if (!confirm('PERMANENTLY delete ' + ids.length + ' job' + (ids.length > 1 ? 's' : '') + '?\n\nThis also removes related applications, messages, ratings, and reports.\nCannot be undone. Consider Cancel instead.')) return;

  var btn = document.getElementById('del-btn');
  btn.disabled = true; btn.textContent = '🗑 Deleting…';

  await sb.from('applications').delete().in('task_id', ids);
  await sb.from('messages').delete().in('task_id', ids);
  await sb.from('ratings').delete().in('task_id', ids);
  await sb.from('reports').delete().in('task_id', ids);

  var res = await sb.from('tasks').delete().in('id', ids);

  if (res.error) {
    toast('❌ Delete failed: ' + res.error.message);
    btn.disabled = false;
    btn.innerHTML = '🗑 Delete Selected (<span id="del-count">' + selected.size + '</span>)';
    return;
  }

  toast('✅ Deleted ' + ids.length + ' job' + (ids.length > 1 ? 's' : ''));
  loadJobs();
}

// ── Init ──
sb.auth.getSession().then(function(res) {
  if (res.data.session) onAuth(res.data.session.user);
});
sb.auth.onAuthStateChange(function(_event, session) {
  if (session) onAuth(session.user);
  else {
    document.getElementById('auth-view').style.display = 'flex';
    document.getElementById('app-view').style.display = 'none';
  }
});

document.getElementById('magic-email').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') sendMagicLink();
});
</script>
</body>
</html>
